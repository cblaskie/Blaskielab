services:
  whoami:
    image: traefik/whoami:latest
    container_name: test-whoami
    restart: unless-stopped
    networks:
      - proxy_net # Must connect to your shared external network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.theblaskies.com`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=cloudflare"
      
      # Just chain the auth gate and the pretty errors
      - "traefik.http.routers.whoami.middlewares=pocketid-auth@file,pretty-errors@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
networks:
  proxy_net:
    external: true
