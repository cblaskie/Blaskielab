version: "3.8"

services:
  apprise:
    image: lscr.io/linuxserver/apprise-api:latest
    container_name: apprise_api
    restart: unless-stopped
    volumes:
      # Maps your persistent storage directory on the host to /config inside the container
      - ./apprise-config:/config
    environment:
      - PUID=1000
      - PGID=1000
      # Pulls variables cleanly from your .env file
      - TZ=${TZ}
      - APPRISE_CONFIG=${APPRISE_CONFIG}
      - APPRISE_WEBHOOK_TOKEN=${APPRISE_WEBHOOK_TOKEN}
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apprise.rule=Host(`notify.theblaskies.com`)"
      - "traefik.http.routers.apprise.entrypoints=websecure"
      - "traefik.http.routers.apprise.tls.certresolver=cloudflare"
      - "traefik.http.services.apprise.loadbalancer.server.port=8000"

networks:
  proxy_net:
    external: true
