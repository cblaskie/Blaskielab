version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest@sha256:307d6065be25619aa24cfc63a7c2f04ca56d084a08c05c8e9f189a89f353b1ec
    container_name: n8n_automation
    restart: unless-stopped
    # Forces the container process to run using the correct internal node permissions
    user: "1000:1000"
    volumes:
      - /mnt/user/appdata/n8n:/home/node/.n8n
    environment:
      - TZ=${TZ}
      - N8N_HOST=n8n.theblaskies.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_SECURE_COOKIE=true
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.theblaskies.com`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

networks:
  proxy_net:
    external: true
