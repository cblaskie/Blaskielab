version: "3.8"

services:
  traefik-forward-auth:
    image: ghcr.io/italypaleale/traefik-forward-auth:4@sha256:7008a2017836aa6dc4baeed9df852fc0aa0d0e670976b0c8a0e5b10d9a837292
    container_name: traefik-forward-auth
    restart: unless-stopped
    volumes:
      # This is the CONTAINER level volume mapping (Indented correctly under the service)
      - /mnt/user/appdata/traefik-forward-auth/config.yaml:/etc/traefik-forward-auth/config.yaml:ro
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tfa-secure-router.rule=Host(`auth.theblaskies.com`)"
      - "traefik.http.routers.tfa-secure-router.entrypoints=websecure"
      - "traefik.http.routers.tfa-secure-router.tls.certresolver=cloudflare"
      - "traefik.http.services.tfa-secure-service.loadbalancer.server.port=4181"

# 🎯 FIXED: These blocks are flush against the left margin, completely separated from services
networks:
  proxy_net:
    external: true
