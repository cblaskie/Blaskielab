services:
  # --- Traefik Forward Auth Layer ---
    traefik-forward-auth:
    image: ghcr.io/italypaleale/traefik-forward-auth:4
    container_name: traefik-forward-auth
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/traefik-forward-auth:/etc/traefik-forward-auth
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      # 🎯 FIXED: Changed the router identity to break away from stale ghost rules
      - "traefik.http.routers.tfa-secure-router.rule=Host(`auth.theblaskies.com`)"
      - "traefik.http.routers.tfa-secure-router.entrypoints=websecure"
      - "traefik.http.routers.tfa-secure-router.tls.certresolver=cloudflare"
      - "traefik.http.services.tfa-secure-service.loadbalancer.server.port=4181"

networks:
  proxy_net:
    external: true
