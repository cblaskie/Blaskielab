services:
  traefik-forward-auth:
    image: ghcr.io/italypaleale/traefik-forward-auth:4
    container_name: traefik-forward-auth
    restart: unless-stopped
    
    # 🔒 SAFE FOR GITHUB: Mounts the local server folder safely out of Git's reach
    volumes:
      - /mnt/user/appdata/traefik-forward-auth:/etc/traefik-forward-auth      
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.theblaskies.com`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls.certresolver=cloudflare"
      - "traefik.http.services.auth.loadbalancer.server.port=4181"

networks:
  proxy_net:
    external: true
