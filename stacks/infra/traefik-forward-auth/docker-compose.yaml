services:
  # --- Traefik Forward Auth Layer ---
  traefik-forward-auth:
    image: ghcr.io/italypaleale/traefik-forward-auth:4
    container_name: traefik-forward-auth
    restart: unless-stopped
    environment:
      - TFA_DEFAULT_PORTAL=main
    volumes:
      # 🔒 SAFE FOR GITHUB: Points to your local server's absolute configuration path
      - /mnt/user/appdata/traefik-forward-auth/config.yaml:/etc/traefik-forward-auth/config.yaml:ro
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.theblaskies.com`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls.certresolver=cloudflare"
      # 🎯 Ensures Traefik targets the correct management interface port
      - "traefik.http.services.auth.loadbalancer.server.port=4181"

networks:
  proxy_net:
    external: true
