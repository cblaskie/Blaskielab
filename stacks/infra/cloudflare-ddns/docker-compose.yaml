services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
    container_name: cloudflare-ddns
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # DDNS only manages A records
      DOMAINS: theblaskies.com,*.theblaskies.com

      # Proxy everything EXCEPT Plex (handled via CNAME)
      PROXIED: "true"

      TTL: "300"
      IP_VERSION: ipv4
      UPDATE_INTERVAL: 300

    networks:
      - infra_net
networks:
  infra_net:
    external: true

