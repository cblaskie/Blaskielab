services:
  adguardhome:
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    hostname: adguardhome
    restart: unless-stopped

    volumes:
      - /mnt/user/appdata/adguardhome/work:/opt/adguardhome/work
      - /mnt/user/appdata/adguardhome/conf:/opt/adguardhome/conf

    networks:
      lan_macvlan:
        ipv4_address: 10.69.1.51
      proxy_net:

    # REMOVED the "10.69.1.51:53:53" host port blocks.
    # Exposing container ports directly so they are accessible on the macvlan IP.
    expose:
      - "53/tcp"
      - "53/udp"
      - "3000/tcp"

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net

      # ---- AdGuard UI Router ----
      - traefik.http.routers.adguard.rule=Host(`adguard.theblaskies.com`)
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.routers.adguard.tls=true
      - traefik.http.routers.adguard.tls.certresolver=cloudflare

      # ---- Service ----
      - traefik.http.services.adguard.loadbalancer.server.port=3000

networks:
  lan_macvlan:
    driver: macvlan
    driver_opts:
      parent: br0
    ipam:
      config:
        - subnet: 10.69.1.0/24
          gateway: 10.69.1.1

  proxy_net:
    external: true
