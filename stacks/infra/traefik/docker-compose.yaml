services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: docker-socket-proxy
    restart: unless-stopped

    environment:
      CONTAINERS: 1
      SERVICES: 1
      NETWORKS: 1
      TASKS: 1
      EVENTS: 1
      INFO: 1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - proxy_net


  traefik:
    image: traefik@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    container_name: traefik
    restart: unless-stopped

    env_file:
      - .env

    command:
      - --configFile=/etc/traefik/traefik.yml

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Static config
      - /mnt/user/appdata/komodo/repos/Blaskielab/stacks/infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro

      # Dynamic config (Git-managed)
      - /mnt/user/appdata/komodo/repos/Blaskielab/stacks/infra/traefik/dynamic:/etc/traefik/dynamic:ro

      # ACME storage
      - /mnt/user/appdata/traefik/acme:/etc/traefik/acme

    networks:
      - proxy_net

  error-pages:
    image: ghcr.io/tarampampam/error-pages:latest@sha256:b8ded6f847df91075429cf79cb9491bfd7d96de69936555498a2ff0614e003e4
    container_name: error-pages
    restart: unless-stopped
    environment:
      - TEMPLATE_NAME=shuffle # Pick your aesthetic: ghost, l33t, matrix, connection, etc.
      - SHOW_DETAILS=true
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      # This registers it globally for Traefik's file provider to hook into
      - "traefik.http.services.error-pages-service.loadbalancer.server.port=8080"

networks:
  proxy_net:
    external: true
