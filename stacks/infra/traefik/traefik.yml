log:
  level: DEBUG

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    # Added configuration block to handle cross-VLAN proxies
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "192.168.0.0/16"  # Trusts your main LAN and your new IoT VLAN ranges
        - "172.16.0.0/12"   # Trusts internal Docker bridge networks

providers:
  docker:
    endpoint: tcp://docker-socket-proxy:2375
    exposedByDefault: false
    network: proxy_net

  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: cblaskie@gmail.com
      storage: /etc/traefik/acme/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

serversTransport:
  insecureSkipVerify: true