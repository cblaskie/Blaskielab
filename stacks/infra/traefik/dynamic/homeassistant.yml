http:
  routers:
    homeassistant:
      rule: Host(`ha.theblaskies.com`)
      entryPoints:
        - websecure
      service: homeassistant
      middlewares:
        - homeassistant-headers
      tls:
        certResolver: cloudflare

  services:
    homeassistant:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://10.69.1.100:8123"

  middlewares:
    homeassistant-headers:
      headers:
        # Removed X-Forwarded-Host/Proto to prevent 502 header conflicts.
        # Traefik handles these natively.
        customResponseHeaders:
          X-Frame-Options: "SAMEORIGIN"
