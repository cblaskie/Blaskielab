http:
  services:
    # Connects Traefik to your centralized error-pages container
    error-pages-service:
      loadBalancer:
        servers:
          - url: "http://error-pages:8080"

  middlewares:
    # 🔐 Restored High Management Port Authentication Gateway
    pocketid-auth:
      forwardAuth:
        # 🔄 FIXED: Pointed back to port 4181 for native authentication parsing
        address: "http://traefik-forward-auth:4181/_oauth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Forwarded-User"

    # 🎨 Your Shuffle-themed Custom Error Dashboard Middleware
    pretty-errors:
      errors:
        status:
          - "404"
          - "500-504"
        service: error-pages-service
        query: "/{status}.html"
