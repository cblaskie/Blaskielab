http:
  services:
    # Maps your error-pages container to the file provider
    error-pages-service:
      loadBalancer:
        servers:
          - url: "http://error-pages:8080"

  middlewares:
    # The new simplified Traefik Forward Auth middleware
    pocketid-auth:
      forwardAuth:
        address: "http://traefik-forward-auth:80" 
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Forwarded-User"

    # Your Shuffle-themed Error Dashboard Middleware
    pretty-errors:
      errors:
        status:
          - "404"
          - "500-504"
        service: error-pages-service
        query: "/{status}.html"
