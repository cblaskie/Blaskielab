http:
  services:
    # Connects Traefik to your centralized error-pages container
    error-pages-service:
      loadBalancer:
        servers:
          - url: "http://error-pages:8080"

  middlewares:
    # 🔐 The Unified Single Sign-On Gateway
    pocketid-auth:
      forwardAuth:
        # 🎯 Crucial: Pointed to port 80 and targeting your config's "main" portal
        address: "http://traefik-forward-auth:80/_oauth/verify?portal=main"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Forwarded-User"

    # 🎨 Your Shuffle-themed Custom Error Dashboard Middleware
    pretty-errors:
      errors:
        status:
          - "404"
          - "500-504"
        service: error-pages-service
        query: "/{status}.html"
