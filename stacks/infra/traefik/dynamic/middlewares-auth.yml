http:
  services:
    error-pages-service:
      loadBalancer:
        servers:
          - url: "http://error-pages:8080"

  middlewares:
    # 🔐 Verified v4 Dynamic Middleware Mapping
    pocketid-auth:
      forwardAuth:
        address: "http://traefik-forward-auth:4181/portals/main"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Forwarded-User"

    pretty-errors:
      errors:
        status:
          - "404"
          - "500-504"
        service: error-pages-service
        query: "/{status}.html"
