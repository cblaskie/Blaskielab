http:
  services:
    # Connects Traefik to your centralized error-pages container
    error-pages-service:
      loadBalancer:
        servers:
          - url: "http://error-pages:8080"

  middlewares:
    # 🔐 Clean Single Sign-On Verification Gateway
    pocketid-auth:
      forwardAuth:
        # 🔄 FIXED: Removed the query string to stop the 500 loop
        address: "http://traefik-forward-auth:80/_oauth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Forwarded-User"

    # 🎨 Your Shuffle-themed Custom Error Dashboard Middleware
    pretty-errors:
      errors:
        status:
          - "404"
          - "500-504"
        service: error-pages-service
        query: "/{status}.html"
