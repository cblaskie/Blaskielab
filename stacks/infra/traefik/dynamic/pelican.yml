http:
  routers:
    pelican-panel:
      rule: "Host(`pelican.theblaskies.com`)"
      entryPoints:
        - websecure
      service: pelican-panel-backend
      tls:
        certResolver: cloudflare # <-- Explicitly uses your Cloudflare TLS provider

    pelican-wings:
      rule: "Host(`wings.theblaskies.com`)"
      entryPoints:
        - websecure
      service: pelican-wings-backend
      tls:
        certResolver: cloudflare # <-- Explicitly uses your Cloudflare TLS provider

  services:
    pelican-panel-backend:
      loadBalancer:
        servers:
          - url: "http://10.69.30.30:8080"

    pelican-wings-backend:
      loadBalancer:
        servers:
          - url: "http://10.69.30.30:8081"
