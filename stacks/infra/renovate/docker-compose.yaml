services:
  renovate:
    image: renovate/renovate:latest@sha256:5cc822c3beaa73d05e8940754e4e7adc9cd1e199cf61d71e2f86d75c84f9c779
    container_name: renovate
    restart: unless-stopped

    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN: ${RENOVATE_TOKEN}

      RENOVATE_GIT_AUTHOR: "Obie Bot <renovate@theblaskies.com>"
      RENOVATE_AUTODISCOVER: "true"
      RENOVATE_BASE_DIR: /tmp/renovate
      RENOVATE_GIT_FS: "true"
      RENOVATE_REPOSITORIES: "cblaskie/Blaskielab"

      # 🌟 FIXED: Stripped out the restrictive RENOVATE_CONCURRENT_LIMIT 
      # and RENOVATE_PR_CONCURRENT_LIMIT variables so they don't fight your renovate.json!

      # Logging
      LOG_LEVEL: info

    volumes:
      - /mnt/user/appdata/renovate:/tmp/renovate

    networks:
      - proxy_net # 🌟 FIXED: Attached natively to your existing external proxy structure

networks:
  proxy_net:
    external: true # 🌟 FIXED: Informs the engine this is permanent, clearing out the "network not found" loop
