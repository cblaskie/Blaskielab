services:
  # Time-Series Database Engine
  influxdb:
    image: influxdb:2.9@sha256:e4572d094ac3272f06528ea904ce6b4cb3bb19be2db3b3b1acbd27ba5c3a73e2
    container_name: influxdb
    restart: unless-stopped
    networks:
      - proxy_net
    volumes:
      - ${APPDATA_DIR}/influxdb/data:/var/lib/influxdb2
      - ${APPDATA_DIR}/influxdb/config:/etc/influxdb2
    environment:
      - INFLUXD_REPORTING_DISABLED=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influxdb.rule=Host(`influx.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.influxdb.entrypoints=websecure"
      - "traefik.http.routers.influxdb.tls.certresolver=cloudflare"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"

  # Visualization Dashboard Panel
  grafana:
    image: grafana/grafana-oss:latest@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    user: "99:100"  # Enforces Unraid host permissions to bypass container permission errors
    restart: unless-stopped
    networks:
      - proxy_net
    depends_on:
      - influxdb
    volumes:
      - ${APPDATA_DIR}/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=${GRAFANA_EMBEDDING:-true}
      - GF_USERS_ALLOW_SIGN_UP=${GRAFANA_SIGNUP_DISABLED:-false}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Plex Media Analytics Engine
  tautulli:
    image: ghcr.io/tautulli/tautulli:latest@sha256:e2f9410116ffd6667c32875ba2f3038aa0a6acb6c4f64403f535ae435eeaab2a
    container_name: tautulli
    restart: unless-stopped
    networks:
      - proxy_net
    volumes:
      - ${APPDATA_DIR}/tautulli:/config
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TIMEZONE:-America/New_York}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.tls.certresolver=cloudflare"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

networks:
  proxy_net:
    external: true
