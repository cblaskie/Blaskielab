# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Git-managed seed only. Existing Unraid deployment uses the writable copy at
# /mnt/user/appdata/agentgateway/config.yaml.
#
# Before enabling this OIDC policy in the live config, fill the real values in
# the private .env / Komodo environment and ensure Pocket ID has the callback URI.
# Keep Traefik ForwardAuth enabled until native login is verified.
#
# MCP port 4000 is NOT publicly routed until separate MCP OAuth is configured.
config:
  database:
    url: sqlite:///config/data.db

gateways:
  mcp-gateway:
    port: 4000
  ui-gateway:
    port: 4001

ui:
  gateways: [ui-gateway]
  policies:
    oidc:
      issuer: ${ISSUER_URL}
      clientId: ${UI_CLIENT_ID}
      clientSecret: ${UI_CLIENT_SECRET}
      redirectURI: ${REDIRECT_URI}
      credentials: session
      scopes:
        - profile
        - email

# MCP traffic uses port 4000. Do not add a public Traefik router before
# inbound MCP authentication and per-tool authorization are configured.
# HA_MCP_TOKEN is supplied privately by Komodo; never commit its value.
mcp:
  gateways:
    - mcp-gateway

  targets:
    - name: homeassistant
      mcp:
        host: https://ha.theblaskies.com/api/mcp
      policies:
        backendAuth:
          key:
            value: "$HA_MCP_TOKEN"

  statefulMode: stateless
  failureMode: failClosed

  policies:
    cors:
      allowOrigins:
        - https://agentgateway.theblaskies.com
      allowHeaders:
        - "*"
      allowMethods:
        - GET
        - POST
        - OPTIONS
      exposeHeaders:
        - Mcp-Session-Id
