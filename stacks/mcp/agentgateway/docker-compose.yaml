name: agentgateway

services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    container_name: agentgateway
    restart: unless-stopped

    # Pin the Unraid nobody:users IDs. Do not allow stack environment overrides.
    user: "99:100"

    # Use the persistent configuration (seeded from the Git-managed config.yaml).
    command: ["-f", "/config/config.yaml"]

    environment:
      TZ: ${TZ:-America/New_York}

      # Pocket ID OIDC for agentgateway's native dashboard login.
      # Values are supplied by a private .env file or Komodo environment variables.
      ISSUER_URL: ${ISSUER_URL:-https://id.theblaskies.com}
      UI_CLIENT_ID: ${UI_CLIENT_ID:-}
      UI_CLIENT_SECRET: ${UI_CLIENT_SECRET:-}
      REDIRECT_URI: ${REDIRECT_URI:-https://agentgateway.theblaskies.com/oauth/callback}
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-}
      HA_MCP_TOKEN: ${HA_MCP_TOKEN:?Set HA_MCP_TOKEN in Komodo}

    volumes:
      - ${AGENTGATEWAY_DATA_DIR:-/mnt/user/appdata/agentgateway}:/config

    networks:
      - proxy_net

    security_opt:
      - no-new-privileges:true

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"

      # Dashboard only. MCP port 4000 has NO public router until OAuth is configured.
      - "traefik.http.routers.agentgateway.rule=Host(`${AGENTGATEWAY_DOMAIN:-agentgateway.theblaskies.com}`)"
      - "traefik.http.routers.agentgateway.entrypoints=websecure"
      - "traefik.http.routers.agentgateway.tls=true"
      - "traefik.http.routers.agentgateway.tls.certresolver=cloudflare"
      # Retain ForwardAuth during native OIDC migration. Remove after verifying
      # Pocket ID login and restricting which OIDC users can access the UI.
      - "traefik.http.routers.agentgateway.middlewares=pocketid-auth@file"
      - "traefik.http.routers.agentgateway.service=agentgateway-ui"
      - "traefik.http.services.agentgateway-ui.loadbalancer.server.port=4001"

networks:
  proxy_net:
    external: true
