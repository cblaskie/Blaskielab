services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2284@sha256:6f1fcbf31714137ec3d1c48d4aa57a8d158e3f88afd34a3d6999338cd1bd189a
    container_name: suwayomi
    restart: unless-stopped
    networks:
      - proxy_net
      - media_net
    environment:
      - PUID=99
      - PGID=100
      - TZ=America/New_York
      - SUWAYOMI_SERVER_DOWNLOAD_AS_CBZ=true
      # Keeps your extensions pinned and active automatically on deployment
      - EXTENSION_REPOS=["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]
    volumes:
      # Persistent config storage on your array cache/pool
      - /mnt/user/appdata/suwayomi:/home/suwayomi/.local/share/suwayomi-server
      
      # Mapped to Grimmory's book drop folder on your Unraid host
      - /mnt/user/data/usenet/complete/manga:/data/manga
      
      # Mapped to your long-term archival manga storage share
      - /mnt/user/data/media/manga:/data/media_archive
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.suwayomi.rule=Host(`manga.theblaskies.com`)"
      - "traefik.http.routers.suwayomi.entrypoints=websecure"
      - "traefik.http.services.suwayomi.loadbalancer.server.port=4567"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.suwayomi.tls.certresolver=cloudflare"

networks:
  proxy_net:
    external: true
  media_net:
    external: true
