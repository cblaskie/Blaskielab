services:
  # 1. Spotify Downloader (Official Dev Branch + Web Path Fix)
  spotdl:
    build:
      context: https://github.com/spotDL/spotify-downloader.git#dev
    container_name: spotdl
    restart: unless-stopped
    user: "0:0"
    working_dir: /app
    entrypoint: >
      sh -c "pip install -U --root-user-action=ignore yt-dlp spotdl && (echo n | spotdl --download-deno) && spotdl web --host 0.0.0.0 --port 8800 --web-use-output-dir --output /music"
    volumes:
      - /mnt/user/world/personal/shared/yoto:/music
    environment:
      - TZ=${TZ}
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spotdl.rule=Host(`spotdl.theblaskies.com`)"
      - "traefik.http.routers.spotdl.entrypoints=websecure"
      - "traefik.http.routers.spotdl.tls.certresolver=cloudflare"
      - "traefik.http.services.spotdl.loadbalancer.server.port=8800"
      # 🛠️ PREVENTS SSE DISCONNECTS: Flushes data chunks immediately to keep Datastar SSE alive
      - "traefik.http.middlewares.spotdl-buffering.buffering.maxResponseBodyBytes=0"
      - "traefik.http.routers.spotdl.middlewares=spotdl-buffering@docker"

  # 2. YouTube-to-Audio (Metube)
  youtube-dl:
    image: alexta69/metube:latest@sha256:c5ed53d2e9f3aff3982a599aac74388d36879722b1a553a9ae0200346a321ec9
    container_name: youtube_audio_dl
    user: "99:100"
    restart: unless-stopped
    volumes:
      - /mnt/user/world/personal/shared/yoto:/downloads
    environment:
      - OUTPUT_TEMPLATE=%(title)s.%(ext)s
      - OUTPUT_TEMPLATE_PLAYLIST=%(playlist_title)s/%(title)s.%(ext)s
      - YTDL_OPTIONS={"extract_audio":true,"audio_format":"mp3","quality":"0"}
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ytdl.rule=Host(`ytdl.theblaskies.com`)"
      - "traefik.http.routers.ytdl.entrypoints=websecure"
      - "traefik.http.routers.ytdl.tls.certresolver=cloudflare"
      - "traefik.http.services.ytdl.loadbalancer.server.port=8081"

networks:
  proxy_net:
    external: true
