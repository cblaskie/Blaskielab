services:
  # 1. Spotify Downloader (Official Image + Volume Mask Fix)
  spotdl:
    image: spotdl/spotify-downloader:latest
    container_name: spotdl
    restart: unless-stopped
    # 1. FIXED: Drops permissions to Unraid non-root user cleanly
    user: "99:100"
    # 2. FIXED: Uses the native web command directly
    command: web --host 0.0.0.0 --web-use-output-dir
    volumes:
      # Maps your music folder directly to spotDL's output engine
      - /mnt/user/world/personal/shared/yoto:/music
      # 3. FIXED: Masks the internal cache directories with writable anonymous volumes
      - /tmp/.spotdl
      - /tmp/.cache
    environment:
      - TZ=${TZ}
      # 4. FIXED: Directs home environment context to the open /tmp folder
      - HOME=/tmp
    working_dir: /music
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spotdl.rule=Host(`spotdl.theblaskies.com`)"
      - "traefik.http.routers.spotdl.entrypoints=websecure"
      - "traefik.http.routers.spotdl.tls.certresolver=cloudflare"
      - "traefik.http.services.spotdl.loadbalancer.server.port=8800"

  # 2. YouTube-to-Audio (Metube)
  youtube-dl:
    image: alexta69/metube:latest
    container_name: youtube_audio_dl
    user: "99:100"
    restart: unless-stopped
    volumes:
      - /mnt/user/world/personal/shared/yoto:/downloads
    environment:
      - OUTPUT_TEMPLATE=%(title)s.%(ext)s
      - YTDL_OPTIONS={"extract_audio":true,"audio_format":"mp3","quality":"0"}
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ytdl.rule=Host(`ytdl.theblaskies.com`)"
      - "traefik.http.routers.ytdl.entrypoints=websecure"
      - "traefik.http.routers.ytdl.tls.certresolver=cloudflare"
      - "traefik.http.services.ytdl.loadbalancer.server.port=8081"

networks:
  proxy_net:
    external: true
