services:
  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:v1.0.0@sha256:21c6bfa4f4c86ab2dd0232da0dfb3ed4c5d929e42e09894e7b4d2154d0c144f6
    container_name: unpackerr
    restart: unless-stopped
    user: "1002:281"

    env_file:
      - .env

    volumes:
      - /mnt/user/data:/data

    networks:
      - media_net
networks:
   media_net:
     external: true
