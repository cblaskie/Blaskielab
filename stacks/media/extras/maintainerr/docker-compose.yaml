services:
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest@sha256:5dcd5bef9d49c614bb74453df3da198afc05a38d8e2cd96b3669bc2c76a94112
    container_name: maintainerr
    user: "99:100"
    restart: unless-stopped

    networks:
      - proxy_net
      - media_net

    security_opt:
      - no-new-privileges:true

    environment:
      - TZ=America/New_York

    volumes:
      - /mnt/user/appdata/maintainerr:/opt/data

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintainerr.rule=Host(`maintainerr.theblaskies.com`)"
      - "traefik.http.routers.maintainerr.entrypoints=websecure"
      - "traefik.http.routers.maintainerr.tls.certresolver=cloudflare"
      - "traefik.http.services.maintainerr.loadbalancer.server.port=6246"

networks:
  proxy_net:
    external: true
  media_net:
    external: true