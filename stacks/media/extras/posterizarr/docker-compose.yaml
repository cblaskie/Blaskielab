services:
  posterizarr:
    image: ghcr.io/fscorrupt/posterizarr:latest@sha256:8fb1b09b330e10a8cdbda5e03cb63dcb3565ced7ba08832edf7930f2ccc0f337
    container_name: posterizarr
    restart: unless-stopped
    user: "99:100"
    env_file:
      - .env

    environment:
      TZ: "${TZ}"
      RUN_TIME: "disabled" # 🌟 FIXED: Safety flag correctly bypasses the container timer conflict

    volumes:
      # 🌟 FIXED: Cleaned up the nested config mount path to prevent background folder crashes
      - /mnt/user/appdata/posterizarr:/config
      - /mnt/user/appdata/posterizarr/manualassets:/manualassets
      - /mnt/user/appdata/posterizarr/assetsbackup:/assetsbackup
      - /mnt/user/data/assets:/assets:rw

    networks:
      - media_net
      - proxy_net

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.posterizarr.rule=Host(`posterizarr.theblaskies.com`)"
      - "traefik.http.routers.posterizarr.entrypoints=websecure"
      - "traefik.http.routers.posterizarr.tls=true"
      - "traefik.http.routers.posterizarr.tls.certresolver=cloudflare"
      
      # 🔐 SECURED: Integrates your central authentication layer and error handling files
      - "traefik.http.services.posterizarr.loadbalancer.server.port=8000"

networks:
  media_net:
    external: true

  proxy_net:
    external: true
