services:
  kometa:
    image: kometateam/kometa:latest@sha256:6c3971a4aaa928b045e5f22514196b6db7f9b2b186158ebfe3239f4b328dfb0a
    container_name: kometa
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /mnt/user/appdata/kometa:/config
      - /mnt/user/data/assets:/config/assets:rw

    networks:
      - media_net
      - proxy_net

    labels:
      - "traefik.enable=true"
      # Using strict backticks (`) for the domain string to satisfy Traefik's internal syntax compiler
      - "traefik.http.routers.kometa.rule=Host(`kometa.theblaskies.com`)"
      - "traefik.http.routers.kometa.entrypoints=websecure"
      - "traefik.http.routers.kometa.tls.certresolver=cloudflare"
            
      # Targets the internal web port that the core Kometa web UI/API server listens on
      - "traefik.http.services.kometa.loadbalancer.server.port=8080"

networks:
  media_net:
    external: true
  proxy_net:
    external: true
