services:
  omnibus:
    image: ghcr.io/hankscafe/omnibus:latest@sha256:42f09abe415cd3e474746a4d6e2c0fde0f5bdc1fd28815461a452196dec8bb92
    container_name: omnibus
    restart: unless-stopped
    depends_on:
      - omnibus-redis
      - omnibus-engine
    environment:
      - TZ=America/New_York
      - NEXTAUTH_URL=https://omnibus.theblaskies.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - OMNIBUS_REDIS_URL=redis://omnibus-redis:6379/0
      - REDIS_HOST=omnibus-redis
      - REDIS_PORT=6379
      - OMNIBUS_ENGINE_URL=http://omnibus-engine:8000
      - DATABASE_URL=file:/config/omnibus.db
      - OMNIBUS_CACHE_DIR=/config/cache
      - OMNIBUS_LOGS_DIR=/config/logs
      - OMNIBUS_BACKUPS_DIR=/config/backups
      - OMNIBUS_WATCHED_DIR=/data/watched
      - OMNIBUS_AWAITING_MATCH_DIR=/data/unmatched
      - UMASK=000
    volumes:
      - /mnt/user/appdata/omnibus/config:/config
      - /mnt/user/data:/data
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.omnibus.rule=Host(`omnibus.theblaskies.com`)"
      - "traefik.http.routers.omnibus.entrypoints=websecure"
      - "traefik.http.routers.omnibus.tls.certresolver=cloudflare"
      - "traefik.http.services.omnibus.loadbalancer.server.port=3000"

  omnibus-engine:
    image: ghcr.io/hankscafe/omnibus-engine:latest@sha256:c1a4d475c81bccaaca5114651a2c0841b8125581c99c44835615b9ee053979c9
    container_name: omnibus-engine
    restart: unless-stopped
    depends_on:
      - omnibus-redis
    environment:
      - TZ=America/New_York
      - DATABASE_URL=file:/config/omnibus.db
      - OMNIBUS_ENGINE_BIND=0.0.0.0:8000
      - OMNIBUS_NODE_URL=http://omnibus:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - OMNIBUS_BACKUPS_DIR=/config/backups
      - OMNIBUS_CACHE_DIR=/config/cache
      - OMNIBUS_WATCHED_DIR=/data/watched
      - OMNIBUS_AWAITING_MATCH_DIR=/data/unmatched
      - UMASK=000
    volumes:
      - /mnt/user/appdata/omnibus/config:/config
      - /mnt/user/data:/data
    networks:
      - proxy_net

  omnibus-redis:
    image: redis:alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    container_name: omnibus-redis
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/omnibus/redis:/data
    networks:
      proxy_net:
        aliases:
          - omnibus-redis

networks:
  proxy_net:
    external: true
