services:
  omnibus:
    image: ghcr.io/hankscafe/omnibus:latest
    container_name: omnibus
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/omnibus/config:/config
      - /mnt/user/data:/data
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=99
      - PGID=100
      - OMNIBUS_ENGINE_URL=http://omnibus-engine:8000
      - DATABASE_URL=file:/config/omnibus.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Point Omnibus to the internal Redis container instead of 127.0.0.1
      - REDIS_URL=redis://redis:6379
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.omnibus.rule=Host(`omnibus.theblaskies.com`)"
      - "traefik.http.routers.omnibus.entrypoints=websecure"
      - "traefik.http.routers.omnibus.tls.certresolver=cloudflare"
      - "traefik.http.services.omnibus.loadbalancer.server.port=3000"

  omnibus-engine:
    image: ghcr.io/hankscafe/omnibus-engine:latest
    container_name: omnibus-engine
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/omnibus/config:/config
      - /mnt/user/data:/data
    environment:
      - PUID=99
      - PGID=100
      - DATABASE_URL=file:/config/omnibus.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - REDIS_URL=redis://redis:6379
    networks:
      - proxy_net

  redis:
    image: redis:alpine
    container_name: omnibus-redis
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/omnibus/redis:/data
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
