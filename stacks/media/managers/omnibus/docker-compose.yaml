services:
  omnibus:
    image: ghcr.io/hankscafe/omnibus:latest
    container_name: omnibus
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/omnibus/config:/config
      - /mnt/user/data/media/comics:/comics
      - /mnt/user/data/media/manga:/manga
      - /mnt/user/data/usenet/complete:/downloads
    environment:
      - TZ=${TZ:-America/New_York}
      - OMNIBUS_ENGINE_URL=http://omnibus-engine:8000
      - DATABASE_URL=file:/config/omnibus.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.omnibus.rule=Host(`omnibus.theblaskies.com`)"
      - "traefik.http.routers.omnibus.entrypoints=websecure"
      - "traefik.http.routers.omnibus.tls.certresolver=cloudflare"
      # PocketID ForwardAuth disabled for now (uncomment once PocketID / forward-auth is configured):
      # - "traefik.http.routers.omnibus.middlewares=pocketid-auth@file,pretty-errors@file"
      # Optional: keep only custom error pages active without authentication gate
      # - "traefik.http.routers.omnibus.middlewares=pretty-errors@file"
      - "traefik.http.services.omnibus.loadbalancer.server.port=3000"

  omnibus-engine:
    image: ghcr.io/hankscafe/omnibus-engine:latest
    container_name: omnibus-engine
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/omnibus/config:/config
      - /mnt/user/data/media/comics:/comics
      - /mnt/user/data/media/manga:/manga
      - /mnt/user/data/usenet/complete:/downloads
    environment:
      - DATABASE_URL=file:/config/omnibus.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
