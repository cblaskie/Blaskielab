services:
  readmeabook:
    image: ghcr.io/kikootwo/readmeabook:latest@sha256:b789e19d8cb888e572094c1b790cf4f57c2249a4a7fd1fab8f55633c79f196cd
    container_name: readmeabook
    restart: unless-stopped
    networks:
      - infra_net
      - proxy_net
    environment:
      - PUID=99
      - PGID=100
      - TZ=${TIMEZONE}
      - PUBLIC_URL=${PUBLIC_URL}
    ports:
      - "3030:3030"
    volumes:
      # App Data
      - /mnt/user/appdata/readmeabook/config:/app/config
      - /mnt/user/appdata/readmeabook/cache:/app/cache
      - /mnt/user/appdata/readmeabook/pgdata:/var/lib/postgresql/data
      - /mnt/user/appdata/readmeabook/redis:/var/lib/redis
      # Media & Downloads (Mapping exactly to your share structure)
      - /mnt/user/data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.readmeabook.rule=Host(`audiobooks.theblaskies.com`)"
      - "traefik.http.routers.readmeabook.entrypoints=websecure"
      - "traefik.http.routers.readmeabook.tls.certresolver=cloudflare" # Change to your resolver name
      - "traefik.http.services.readmeabook.loadbalancer.server.port=3030"

networks:
  infra_net:
    external: true
  proxy_net:
    external: true
