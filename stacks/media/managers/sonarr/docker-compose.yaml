services:
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20@sha256:3b8c947d7fa173f70e40047d2c8d02835fb8416aeb5ae36def57d9ad15e2f906
    container_name: sonarr
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /mnt/user/appdata/sonarr:/config
      - /mnt/user/data:/data
      - /mnt/user/data/recycle-bin:/data/recycle-bin
    networks:
      - media_net
      - proxy_net

    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.theblaskies.com`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

networks:
  media_net:
    external: true
  proxy_net:
    external: true
