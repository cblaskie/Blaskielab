services:
  radarr:
    image: ghcr.io/linuxserver/radarr:6.4.4@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    container_name: radarr
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /mnt/user/appdata/radarr:/config
      - /mnt/user/data:/data
      - /mnt/user/data/recycle-bin:/data/recycle-bin
    networks:
      - media_net
      - proxy_net

    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.theblaskies.com`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.services.radarr.loadbalancer.server.port=7878

networks:
  media_net:
    external: true
  proxy_net:
    external: true
