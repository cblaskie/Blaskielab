services:
  radarr:
    image: ghcr.io/linuxserver/radarr:6.1.1@sha256:15417a594ebda4c660a9fa9748e7199d33e2d17b31bbc5ad7ba2e86f0b414763
    container_name: radarr
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /mnt/user/appdata/radarr:/config
      - /mnt/user/data:/data
      - /mnt/user/data/recycle-bin:/data/recycle-bin
    networks:
      - media_net
      - proxy_net

    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.theblaskies.com`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.services.radarr.loadbalancer.server.port=7878

networks:
  media_net:
    external: true
  proxy_net:
    external: true
