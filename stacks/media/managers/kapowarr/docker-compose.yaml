services:
  kapowarr:
    image: mrcas/kapowarr:latest@sha256:d455797e4f2c5b1a8ccc5ce05c427f1af2179451bb1af195ca3fa8c3e928623b
    container_name: kapowarr
    user: "99:100"
    networks:
      - proxy_net
      - media_net
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/user/appdata/kapowarr:/app/db
      - /mnt/user/appdata/kapowarr/logs:/app/logs
      - /mnt/user/data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.theblaskies.com`)"
      - "traefik.http.routers.kapowarr.entrypoints=websecure"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.tls.certresolver=cloudflare"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
    restart: unless-stopped

networks:
  media_net:
    external: true
  proxy_net:
    external: true
