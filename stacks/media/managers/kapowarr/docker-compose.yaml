services:
  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    networks:
      - proxy_net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /mnt/user/appdata/kapowarr:/app/db
      - /mnt/user/data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kapowarr.rule=Host(`kapowarr.theblaskies.com`)"
      - "traefik.http.routers.kapowarr.entrypoints=https"
      - "traefik.http.routers.kapowarr.tls=true"
      - "traefik.http.routers.kapowarr.tls.certresolver=cloudflare"
      - "traefik.http.services.kapowarr.loadbalancer.server.port=5656"
    restart: unless-stopped

networks:
  proxy_net:
    external: true
