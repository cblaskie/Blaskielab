services:
  bumper-proxy:
    image: nginx:stable-alpine
    container_name: bumper-proxy
    restart: unless-stopped
    networks:
      br0.30:
        ipv4_address: 10.69.30.5
    volumes:
      - /mnt/user/appdata/bumper/nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/user/appdata/bumper/certs:/certs:ro

  bumper:
    image: bmartin5692/bumper:latest
    container_name: bumper
    restart: unless-stopped
    networks:
      br0.30:
        ipv4_address: 10.69.30.4
      proxy_net: # Join the network Traefik is on
    expose:
      - "8007"
      - "8883"
      - "5223"
      - "443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bumper.rule=Host(`bumper.theblaskies.com`)"
      - "traefik.http.routers.bumper.entrypoints=websecure"
      - "traefik.http.routers.bumper.tls.certresolver=letsencrypt"
      - "traefik.http.services.bumper.loadbalancer.server.port=8007"
      # This label is critical: it tells Traefik to look for Bumper on proxy_net
      - "traefik.docker.network=proxy_net"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - BUMPER_ANNOUNCE_IP=10.69.30.4
      - BUMPER_LISTEN=0.0.0.0
      - BUMPER_DEBUG=true
      - BUMPER_DATA=/bumper/data
      - BUMPER_CERT=/bumper/data/certs/bumper.crt
      - BUMPER_KEY=/bumper/data/certs/bumper.key
      - BUMPER_CA=/bumper/data/certs/ca.crt
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/user/appdata/bumper/config:/bumper/data
      - /mnt/user/appdata/bumper/certs:/bumper/data/certs

networks:
  br0.30:
    external: true
  proxy_net:
    external: true
