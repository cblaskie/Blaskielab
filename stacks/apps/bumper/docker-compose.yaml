version: "3.6"

services:
  bumper:
    image: bmartin5692/bumper:latest
    container_name: bumper
    restart: unless-stopped
    # 1. Assign the static IP on the IoT VLAN
    networks:
      iot_vlan:
        ipv4_address: 10.69.30.4
      infra_net: # Keeping this so HA can talk to it if needed
    
    # 2. Port section is removed. 
    # Macvlan allows Bumper to listen on all ports (including 443) on its own IP.
      
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - BUMPER_ANNOUNCE_IP=10.69.30.4
      - BUMPER_LISTEN=0.0.0.0
      - LOG_TO_STDOUT=true
      - BUMPER_DEBUG=true
      - BUMPER_DATA=/bumper/data
      - BUMPER_CERT=/bumper/data/certs/bumper.crt
      - BUMPER_KEY=/bumper/data/certs/bumper.key
      - BUMPER_CA=/bumper/data/certs/ca.crt

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/user/appdata/bumper/config:/bumper/data
      # Ensure certs are inside the config folder or mapped correctly
      - /mnt/user/appdata/bumper/certs:/bumper/data/certs

    labels:
      - "traefik.enable=false" # Disabled because Bumper has its own IP now

networks:
  # 3. Define the Macvlan network for VLAN 30
  iot_vlan:
    driver: macvlan
    driver_opts:
      parent: br0.30  # Double check this matches your Unraid Settings > Network
    ipam:
      config:
        - subnet: 10.69.30.0/24
          gateway: 10.69.30.1 # Your VLAN 30 Gateway (Router)
          
  infra_net:
    external: true
