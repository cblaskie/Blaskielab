services:
  bumper:
    image: bmartin5692/bumper:latest
    container_name: bumper
    restart: unless-stopped
    networks:
      br0.30:
        ipv4_address: 10.69.30.4
      infra_net:
    
    # In Macvlan, 'expose' tells Docker which internal ports are active
    expose:
      - "8007" # Web UI / REST API
      - "8883" # MQTT (Secure)
      - "5223" # XMPP (Legacy)
      - "443"  # XMPP/MQTT (Modern N8+ often uses this)
      
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - BUMPER_ANNOUNCE_IP=10.69.30.4
      - BUMPER_LISTEN=0.0.0.0
      - BUMPER_DEBUG=true
      - BUMPER_DATA=/bumper/data
      - BUMPER_CERT=/bumper/data/certs/bumper.crt
      - BUMPER_KEY=/bumper/data/certs/bumper.key
      - BUMPER_CA=/bumper/data/certs/ca.crt

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/user/appdata/bumper/config:/bumper/data
      - /mnt/user/appdata/bumper/certs:/bumper/data/certs

networks:
  br0.30:
    external: true
  infra_net:
    external: true
