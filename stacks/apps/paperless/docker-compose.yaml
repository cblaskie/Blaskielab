name: paperless

services:
  paperless-redis:
    image: redis:7@sha256:bd28fff4b665fdf1b73e8b5b73ec05d2f858f4fa3c8ea0d7c9bc09f7f6bf7039
    container_name: paperless-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - infra_net

  paperless-gotenberg:
    image: gotenberg/gotenberg:8@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    container_name: paperless-gotenberg
    restart: unless-stopped
    networks:
      - infra_net

  paperless-tika:
    image: apache/tika:3.3.3.0-full@sha256:6ef30abd65df4b6c478907904099d0245bdb0e0686f94fb9bc7493558442bb74
    container_name: paperless-tika
    restart: unless-stopped
    networks:
      - infra_net

  paperless-router:
    build: ./router
    container_name: paperless-router
    restart: unless-stopped
    volumes:
      - /mnt/user/data/paperless/drop:/drop
      - /mnt/user/world/consume:/consume
      - /mnt/user/data/paperless/failed:/failed
    networks:
      - infra_net

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    container_name: paperless
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
    volumes:
      - /mnt/user/data/paperless/data:/usr/src/paperless/data
      - /mnt/user/data/paperless/media:/usr/src/paperless/media
      - /mnt/user/data/paperless/export:/usr/src/paperless/export
      - /mnt/user/world/consume:/usr/src/paperless/consume
    networks:
      - infra_net
      - proxy_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.paperless.rule=Host(`paperless.theblaskies.com`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls.certresolver=cloudflare
      - traefik.http.services.paperless.loadbalancer.server.port=8000
      - traefik.http.middlewares.paperless-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.paperless-headers.headers.customrequestheaders.X-Forwarded-Host=paperless.theblaskies.com
      - traefik.http.routers.paperless.middlewares=paperless-headers

  paperless-ai:
    image: clusterzx/paperless-ai:latest@sha256:2b65888163fd59716f1c8285b31c5bd0b30c9c3c192c42b516688e3887d4ba60
    container_name: paperless-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAPERLESS_BASE_URL: https://paperless.theblaskies.com
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL}
    networks:
      - infra_net
      - proxy_net
    depends_on:
      - paperless
    labels:
      - traefik.enable=true
      - traefik.http.routers.paperless-ai.rule=Host(`paperless-ai.theblaskies.com`)
      - traefik.http.routers.paperless-ai.entrypoints=websecure
      - traefik.http.routers.paperless-ai.tls=true
      - traefik.http.routers.paperless-ai.tls.certresolver=cloudflare
      - traefik.http.services.paperless-ai.loadbalancer.server.port=3000
      - traefik.http.middlewares.paperless-ai-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.paperless-ai-headers.headers.customrequestheaders.X-Forwarded-Host=paperless-ai.theblaskies.com
      - traefik.http.routers.paperless-ai.middlewares=paperless-ai-headers

  paperless-gpt:
    image: ghcr.io/icereed/paperless-gpt:latest@sha256:d668941a829552cc0eddbc7c22506b3480dfbf61bd0d6eae881ad9fcfe2de70c
    container_name: paperless-gpt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAPERLESS_URL: https://paperless.theblaskies.com
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      LLM_PROVIDER: ollama
      LLM_MODEL: ${VISION_LLM_MODEL}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - /mnt/user/appdata/paperless-gpt:/data
    networks:
      - infra_net
      - proxy_net
    depends_on:
      - paperless

networks:
  infra_net:
    external: true
  proxy_net:
    external: true
