services:
  # 3. Central System Dashboard & Cockpit (Timestamp-Based Sync)
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    volumes:
      # Maps your main persistent, working appdata directory
      - [cite_start]/mnt/user/appdata/glance:/app/config [cite: 1]
      # Maps your local Komodo repository folder as the read-only template source
      - [cite_start]/mnt/user/appdata/komodo/repos/blaskielab/audio-pipeline:/repo_backup:ro [cite: 1]
    # 🛠️ FIXED: Uses native timestamp comparisons to sync updates from GitHub instantly
    entrypoint: >
      sh -c "
      echo 'Syncing any fresh updates from GitHub repo to appdata...' [cite: 2]
      
      # 1. Sync master config if the repo version is newer
      [cite_start]if [ -f /repo_backup/glance.yml ]; then [cite: 2]
        [cite_start]cp -u /repo_backup/glance.yml /app/config/glance.yml [cite: 2]
      fi

      # 2. Sync widgets subfolder if any repo files are newer
      [cite_start]if [ -d /repo_backup/widgets ]; then [cite: 3]
        [cite_start]mkdir -p /app/config/widgets [cite: 4]
        cp -ru /repo_backup/widgets/. [cite_start]/app/config/widgets/ [cite: 4, 5]
      fi

      echo 'Sync complete. Launching Glance cockpit...'
      exec /app/glance --config /app/config/glance.yml
      "
    networks:
      - proxy_net [cite: 5]
    labels:
      - "traefik.enable=true" [cite: 5]
      - [cite_start]"traefik.http.routers.glance.rule=Host(`home.theblaskies.com`)" [cite: 5]
      - [cite_start]"traefik.http.routers.glance.entrypoints=websecure" [cite: 5]
      - [cite_start]"traefik.http.routers.glance.tls.certresolver=cloudflare" [cite: 5]
      
      # 🔐 SECURED: Chains your file-based PocketID authentication gate and error handlers
      - [cite_start]"traefik.http.routers.glance.middlewares=pocketid-auth@file,pretty-errors@file" [cite: 10, 102]
      
      # Target the internal port Glance natively listens on
      - [cite_start]"traefik.http.services.glance.loadbalancer.server.port=8080" [cite: 5, 11]

networks:
  proxy_net:
    [cite_start]external: true [cite: 5, 72]
