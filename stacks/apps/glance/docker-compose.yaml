version: "3.8"

services:
  # 3. Central System Dashboard & Cockpit
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    
    # Directs Glance explicitly to its configuration path
    environment:
      - GLANCE_CONFIG=/app/config/glance.yml
      
    volumes:
      # Maps your verified local Unraid appdata share path
      - /mnt/user/appdata/glance:/app/config:ro
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      
      # Forces Traefik to look for this container on the correct shared network mesh
      - "traefik.docker.network=proxy_net"
      
      # Routing parameters for your primary domain root (Single Quotes fix formatting errors)
      - "traefik.http.routers.glance.rule=Host('glance.theblaskies.com')"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls.certresolver=cloudflare"
      
      
      # Tells Traefik to look for Glance on its native internal port
      - "traefik.http.services.glance.loadbalancer.server.port=8080"

networks:
  proxy_net:
    external: true
