version: "3.8"

services:
  # 3. Central System Dashboard & Cockpit
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    
    # Explicitly tells Glance exactly where to read the config file inside the mount
    environment:
      - GLANCE_CONFIG=/app/config/glance.yml
      
    volumes:
      # Points back to your standard Unraid appdata share
      - /mnt/user/appdata/glance:/app/config:ro
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      
      # 🎯 EXPLICIT: Forces Traefik to look for this container on the correct shared network mesh
      - "traefik.docker.network=proxy_net"
      
      # 🛠️ SYNTAX FIX: Swapped backticks for single quotes to prevent string parsing drops
      - "traefik.http.routers.glance.rule=Host('home.theblaskies.com')"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls.certresolver=cloudflare"
      
      # 🔐 SECURED: Protected by your external PocketID auth gate and error file definitions
      - "traefik.http.routers.glance.middlewares=pocketid-auth@file,pretty-errors@file"
      
      # Target the standard internal port Glance natively uses
      - "traefik.http.services.glance.loadbalancer.server.port=8080"

networks:
  proxy_net:
    external: true
