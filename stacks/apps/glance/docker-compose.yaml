version: "3.8"

services:
  # 3. Central System Dashboard & Cockpit (Timestamp-Based Sync)
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    volumes:
      # Main persistent appdata directory where Glance looks for its active configuration
      - /mnt/user/appdata/glance:/app/config
      
      # Points directly to where Komodo pulls your GitHub repo on your host system
      - /etc/komodo/repos/Blaskielab:/repo_backup:ro
      
    # 🔄 FIXED: Multi-line string format explicitly separated with semi-colons for lightweight sh shells
    entrypoint: >
      sh -c "
      echo 'Syncing fresh updates from GitHub repo subfolder...';
      
      # 1. Sync master config if the repo version inside the stack folder is newer
      if [ -f /repo_backup/stacks/apps/glance/glance.yml ]; then
        cp -u /repo_backup/stacks/apps/glance/glance.yml /app/config/glance.yml;
      fi;

      # 2. Sync widgets subfolder if any repo files are newer
      if [ -d /repo_backup/stacks/apps/glance/widgets ]; then
        mkdir -p /app/config/widgets;
        cp -ru /repo_backup/stacks/apps/glance/widgets/. /app/config/widgets/;
      fi;

      echo 'Sync complete. Launching Glance cockpit...';
      exec /app/glance --config /app/config/glance.yml
      "
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`home.theblaskies.com`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls.certresolver=cloudflare"
      
      # 🔐 SECURED: Pass traffic through your PocketID auth gateway and custom error templates
      - "traefik.http.routers.glance.middlewares=pocketid-auth@file,pretty-errors@file"
      
      # Tells Traefik to look for Glance on its native internal port
      - "traefik.http.services.glance.loadbalancer.server.port=8080"

networks:
  proxy_net:
    external: true
