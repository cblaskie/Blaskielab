version: "3.8"

services:
  web:
    image: ghcr.io/karakeep-app/karakeep:latest
    container_name: karakeep-web
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/karakeep/data:/data
    environment:
      - NEXTAUTH_SECRET=${KARAKEEP_SECRET}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - NEXTAUTH_URL=https://karakeep.${DOMAIN}
      
      # Architecture URLs
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_GRPC_URL=http://chrome:3000
      - DATA_DIR=/data
      
      # Optional: Explicitly disable signups after creating your primary admin account
      # - DISABLE_SIGNUPS=true
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      # Traefik Router Mapping
      - "traefik.http.routers.karakeep.rule=Host(`karakeep.${DOMAIN}`)"
      - "traefik.http.routers.karakeep.entrypoints=websecure"
      - "traefik.http.routers.karakeep.tls=true"
      - "traefik.http.routers.karakeep.tls.certresolver=letsencrypt"
      - "traefik.http.services.karakeep.loadbalancer.server.port=3000"

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:with-puppeteer
    container_name: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=3000
    networks:
      - proxy_net

  meilisearch:
    image: getmeili/meilisearch:v1.11.0 # Optimal pinned version for Karakeep full-text search
    container_name: karakeep-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - /mnt/user/appdata/karakeep/meili_data:/meili_data
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
