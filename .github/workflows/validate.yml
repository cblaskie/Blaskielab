name: Configuration Validations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 🌟 FIX 1: Silences the GitHub Runner Node.js 20 Deprecation Warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Compose Syntax
        id: compose_check
        run: |
          # 🌟 ABSOLUTE PATH SAFETIES: Pre-create host appdata root mount frames for uncommitted configs
          sudo mkdir -p /mnt/user/appdata/komodo
          sudo touch /mnt/user/appdata/komodo/.env
          sudo chmod -R 777 /mnt/user/appdata
          
          # 🌟 FIX 2: Export global dummy variables so Docker Compose validator never sees empty volume specs
          export APPDATA_PATH="./mock-appdata"
          export DOMAIN="localhost"
          export SUBDOMAIN="sync"
          export SUBDOMAIN_WEB="notes"
          export COUCHDB_USER="admin"
          export COUCHDB_PASSWORD="password"
          export COUCHDB_DATABASE="vault"
          export TZ="UTC"
          
          find . -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" \) | while read -r file; do
            echo "Checking: $file"
            
            if [ ! -s "$file" ] || ! grep -q '[^[:space:]#]' "$file"; then
              echo "  -> Skipping empty/comment skeleton"
              continue
            fi
            if ! grep -q "services:" "$file"; then
              echo "  -> Skipping config skeleton without services"
              continue
            fi
            
            # Handle localized folder dependencies
            dir_path=$(dirname "$file")
            if [ ! -f "$dir_path/.env" ]; then
              touch "$dir_path/.env"
            fi
            
            # Run layout validation check and capture actual trace errors out
            if ! docker compose -f "$file" config --quiet; then
              echo "Syntax failure detected in: $file"
              exit 1
            fi
          done
