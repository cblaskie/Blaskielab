name: Configuration Validations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Compose Syntax
        run: |
          # Finds all compose configuration files and evaluates their syntax structure
          find . -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" \) | while read -r file; do
            echo "Checking: $file"
            
            # Extract the folder path containing the compose file
            dir_path=$(dirname "$file")
            
            # 🌟 FIX: If the folder expects a .env file that isn't committed, mock an empty one for the compiler
            if [ ! -f "$dir_path/.env" ]; then
              echo "  -> Creating temporary mock .env file for validation tracking"
              touch "$dir_path/.env"
            fi
            
            # Validate syntax quietly
            docker compose -f "$file" config --quiet
          done

  lint-yaml:
    name: Lint YAML Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
