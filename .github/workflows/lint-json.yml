name: JSON Lint

on:
  pull_request:
    paths:
      - '**/*.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  json-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate JSON Formatting
        run: |
          # Create a clean boolean tracker for tracking inner-loop errors
          FAILED=0
          
          # 🌟 FIX: Explicitly exclude the code-server config directory using find path negation
          find . -name "*.json" ! -path "*/node_modules/*" ! -path "*/code-server/config/*" | while read -r file; do
            echo "Validating JSON structure: $file"
            
            # Use jq with strict exit status flags
            if ! jq -e . "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON syntax detected in: $file"
              # Drop a temporary structural signal flag file since loops execute inside subshells
              touch .json_failed
            fi
          done

          # Evaluate if any true repository configurations failed linting
          if [ -f .json_failed ]; then
            rm .json_failed
            echo "Pipeline halted due to malformed structural JSON files."
            exit 1
          fi
          
          echo "✅ Targeted JSON structures validated successfully!"
