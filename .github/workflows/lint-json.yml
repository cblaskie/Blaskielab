- name: Validate JSON Formatting
        run: |
          FAILED=0
          
          # 🌟 FIX: Change this line to exclude your code-server workspace application data folder
          find . -name "*.json" ! -path "*/node_modules/*" ! -path "*/code-server/*" | while read -r file; do
            echo "Validating JSON structure: $file"
            
            if ! jq -e . "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON syntax detected in: $file"
              touch .json_failed
            fi
          done

          if [ -f .json_failed ]; then
            rm .json_failed
            echo "Pipeline failed due to true malformed JSON files."
            exit 1
          fi
          
          echo "✅ Targeted JSON files validated successfully!"
