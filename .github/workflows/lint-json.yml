name: JSON Lint

on:
  pull_request:
    paths:
      - '**/*.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  json-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate JSON Formatting
        run: |
          FAILED=0
          
          # 🌟 FIX: Added `! -name "renovate.json"` to prevent blocking Renovate's migration branch
          find . -name "*.json" ! -path "*/node_modules/*" ! -path "*/code-server/*" ! -name "renovate.json" | while read -r file; do
            echo "Validating JSON structure: $file"
            
            if ! jq -e . "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON syntax detected in: $file"
              touch .json_failed
            fi
          done

          if [ -f .json_failed ]; then
            rm .json_failed
            echo "Pipeline halted due to true malformed structural JSON payloads."
            exit 1
          fi
          
          echo "✅ Targeted configuration sets processed clean!"
