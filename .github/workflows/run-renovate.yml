name: Run Renovate Now

on:
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Catch up on existing PR backlog (override schedule and PR limits once)"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "0 3 * * 1"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: blaskielab-renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run self-hosted Renovate on GitHub
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify Renovate GitHub secret
        env:
          HAS_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add a repository Actions secret named RENOVATE_TOKEN before running."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: cblaskie/Blaskielab
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.catch_up && '{"schedule":null,"prConcurrentLimit":40,"prHourlyLimit":4}' || '{"schedule":null}') || '{}' }}
          LOG_LEVEL: info
